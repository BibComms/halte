<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Halte bien-être — Expérience</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/hint.css" />
  <script src="assets/js/footer.js" defer></script>
  <script src="assets/js/experience.js" defer></script>
  <script src="assets/js/hint.js" defer></script>
</head>

<body class="kiosk">
  <a class="skip-link" href="#main">Aller au contenu principal</a>
  <header class="topbar">
    <a class="brand brand--link" href="https://bib.umontreal.ca" aria-label="Aller au site des bibliothèques de l'Université de Montréal">
      <img class="brand__logo" src="assets/img/logo-bib.svg" alt="Bibliothèques — logo" />
    </a>

    <a class="titlewrap titlewrap--link" href="/" aria-label="Retour à l'accueil">
      <h1 class="title">Halte bien-être</h1>
      <img class="title__icon" src="assets/img/bien-etre-incone.svg" alt="" aria-hidden="true" />
    </a>

  </header>

  <main class="main main--experience" id="main">
    <section class="panel">
      <div class="panel__head">
        <h2 class="panel__title" id="expH2"></h2>
        <div class="panel__controls">
          <a class="btn btn--ghost" href="index.html" id="backBtn">← Accueil</a>
        </div>
      </div>

      <div class="player" role="region" aria-label="Lecteur de l'expérience">
        <div class="player__media" id="playerMount">
          <!-- iFrame YouTube OU <audio> injecté ici -->
        </div>

        <div class="player__info">
          <div class="player__desc" id="expDesc"></div>

          <div class="chips" id="chipRow"></div>

          <div class="spotify-episodes" id="spotifyEpisodes" hidden>
            <div class="spotify-episodes__title">Épisodes</div>
            <div class="episodes" id="spotifyEpisodeList"></div>
          </div>

          <div class="notice" id="feedbackNotice">
            <span class="notice__text" id="feedbackText">Avez-vous aimé ce contenu?</span>
            <span class="notice__links" id="feedbackLinks">
              <a class="notice__link" href="#" id="feedbackYes">Oui</a>
              <span class="notice__sep">-</span>
              <a class="notice__link" href="#" id="feedbackNo">Non</a>
            </span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="hintMount" data-hint-src="assets/partials/hint.html"></div>
  <div id="footerMount" data-footer-src="assets/partials/footer.html"></div>
</body>
</html>
